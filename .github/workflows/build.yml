name: Build MarkdownObserver
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          repository: larspohlmann/markdownobserver
          ref: 0ce6b934be1c6146a87a86d197c00bb26bb71be3
      - name: Select Xcode 26.2
        run: |
          test -d /Applications/Xcode_26.2.app/Contents/Developer
          echo 'DEVELOPER_DIR=/Applications/Xcode_26.2.app/Contents/Developer' >> "$GITHUB_ENV"
      - name: Build for Apple Silicon
        run: |
          xcodebuild -project minimark.xcodeproj -scheme minimark \
            -configuration Release -destination 'generic/platform=macOS' \
            -derivedDataPath build ARCHS=arm64 CODE_SIGNING_ALLOWED=NO build
      - name: Package app
        run: |
          codesign --force --deep --sign - build/Build/Products/Release/MarkdownObserver.app
          codesign --verify --deep --strict build/Build/Products/Release/MarkdownObserver.app
          ditto -c -k --sequesterRsrc --keepParent \
            build/Build/Products/Release/MarkdownObserver.app MarkdownObserver.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MarkdownObserver-Apple-Silicon
          path: MarkdownObserver.zip
          retention-days: 7
